<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickFocus Manual</title>
  <link rel="stylesheet" href="assets/styles/main.css">
  <link rel="stylesheet" href="assets/styles/manual.css">
</head>
<body>
  <header class="manual-header">
    <div class="container manual-header-row">
      <a class="manual-home-btn" href="index.html">HOME</a>
      <div class="manual-title">QuickFocus</div>
      <label class="manual-language-control" for="manual-language-select">
        <span>Language</span>
        <select id="manual-language-select" aria-label="Select manual language">
          <option value="en">English</option>
          <option value="pt">Português</option>
        </select>
      </label>
    </div>
  </header>

  <main class="manual-layout container">
    <aside class="manual-toc" aria-label="Table of contents">
      <h2>Contents</h2>
      <nav id="manual-toc-list"></nav>
    </aside>
    <article id="manual-content" class="manual-content" aria-live="polite"></article>
  </main>

  <script src="assets/scripts/manual.js"></script>
</body>
</html>
